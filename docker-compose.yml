name: it-uslugi

services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,backend"
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      FRONTEND_INTERNAL_URL: "http://frontend:3000"
      API_INTERNAL_URL: "http://backend:8000"
      BACKEND_URL: "http://backend:8000"
      SITE_URL: "https://uslugi.realkazbek.site"
      USD_RATE: "500"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN}
      API_INTERNAL_URL: "http://backend:8000"
      SITE_URL: "https://uslugi.realkazbek.site"
      USD_RATE: "500"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s
    restart: unless-stopped

volumes:
  pgdata:
