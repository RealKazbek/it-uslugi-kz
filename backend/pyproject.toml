[project]
name = "it-uslugi-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/", ".venv/"]
disallow_any_generics = true

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["core", "catalog", "cities", "leads"]
addopts = "-ra --strict-markers"
# Test-only values; the real secret key only ever lives in .env.
env = [
    "DJANGO_DEBUG=1",
    "DJANGO_SECRET_KEY=test-only-not-a-secret",
    # Empty values keep the Telegram and revalidation webhooks disabled unless a test enables them.
    "TELEGRAM_BOT_TOKEN=",
    "ADMIN_CHAT_ID=",
    "FRONTEND_INTERNAL_URL=",
    "INTERNAL_API_TOKEN=test-only-internal-token",
]
