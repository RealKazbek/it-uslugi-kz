# Public vhost for uslugi.realkazbek.site. Install as /etc/nginx/sites-available/uslugi.conf,
# symlink into sites-enabled, then run `sudo certbot --nginx -d uslugi.realkazbek.site --redirect`
# (certbot adds the 443 server block and the HTTP to HTTPS redirect).
#
# Routing:
#   /admin/, /static/  -> Django (backend container, 127.0.0.1:8000)
#   everything else    -> Next.js frontend (127.0.0.1:3000)
# Internal and API-doc paths are denied at the edge. The backend port stays on loopback, so the
# API docs are reached through an SSH tunnel only (see docs/DEPLOY.md).

# WebSocket-style upgrade only when the client asks for it (Next dev and streaming responses).
# The map must live in the http context; this file is included there from sites-enabled.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

upstream uslugi_backend {
    server 127.0.0.1:8000;
    keepalive 8;
}

upstream uslugi_frontend {
    server 127.0.0.1:3000;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name uslugi.realkazbek.site;

    server_tokens off;
    client_max_body_size 64k;

    # Never public: bot-to-backend API, frontend revalidation webhook, OpenAPI docs and schema.
    location ^~ /api/internal/ { return 404; }
    location = /api/revalidate { return 404; }
    location ^~ /api/docs { return 404; }
    location = /api/schema { return 404; }

    location ^~ /admin/ {
        proxy_pass http://uslugi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /static/ {
        proxy_pass http://uslugi_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
    }

    location / {
        proxy_pass http://uslugi_frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
